mcp_server:
  url: "https://ghost-healer-brain.onrender.com"
  timeout: 30
  confidence_threshold: 0.5
  protocol: "mcp-first"
  api_key: ""

healing:
  mode: "runtime"
  cache_enabled: true
  max_retries: 3
  retry_wait_seconds: 5
  framework: "playwright-python"
  auto_patch: true
  selenium_fixture_names:
    - driver
    - browser
    - webdriver
    - selenium_driver

reporting:
  output_dir: "reports/ghost"
  format: "json"
  save_traces: true
  min_confidence_to_log: 0.0
