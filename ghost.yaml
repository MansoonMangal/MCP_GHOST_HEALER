mcp_server:
  url: "http://127.0.0.1:8000"
  timeout: 30
  confidence_threshold: 0.5

healing:
  mode: "runtime"          # runtime | suggestion
  cache_enabled: true      # Use local SQLite cache
  max_retries: 3           # Retries on cloud cold starts
  retry_wait_seconds: 5    # Base wait between retries
  framework: "playwright-python"

reporting:
  enabled: true
  output_dir: "reports/ghost"
  format: "json"
  save_traces: true        # Include Brain execution trace
  min_confidence_to_log: 0.0
