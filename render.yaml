services:
  - type: web
    name: ghost-healer-brain
    env: docker
    dockerContext: mcp-server
    dockerfilePath: ./mcp-server/Dockerfile
    plan: free
    region: ohio
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MCP_DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_REQUEST_BYTES
        value: "5242880"
      - key: GHOST_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ghost-db
          property: connectionString
    healthCheckPath: /health/ready

databases:
  - name: ghost-db
    plan: free
    region: ohio
