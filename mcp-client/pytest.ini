[pytest]
testpaths = playwright-tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Playwright settings
addopts =
    --headed
    --browser chromium
    --base-url http://localhost:3000
    -v
    -s

# Log output
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
