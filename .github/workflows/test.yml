name: Ghost Healer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  brain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install brain dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp-server/requirements.txt
          pip install pytest httpx

      - name: Run brain unit and contract tests
        run: pytest mcp-server/tests/ -v

  sdk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install SDK and test deps
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run SDK tests
        run: pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run flake8
        run: |
          pip install flake8
          flake8 mcp-server/controllers/ mcp-server/mcp_gateway/ mcp-server/middleware/ scripts/release_gate.py scripts/verify_slo.py --max-line-length=120

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Build
        run: |
          cd mcp-server
          docker build -t ghost-brain:test .
