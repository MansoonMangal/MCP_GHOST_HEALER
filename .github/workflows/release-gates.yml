name: Release Gates

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Release stage gate to validate"
        required: true
        type: choice
        options:
          - beta
          - rc
          - ga
      brain_url:
        description: "Optional deployed brain URL for GA SLO probe"
        required: false
        type: string

jobs:
  validate-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp-server/requirements.txt
          pip install ".[test]"

      - name: Run stage gate checks
        run: |
          python scripts/release_gate.py --stage "${{ github.event.inputs.stage }}" --strict-tools

      - name: Optional GA SLO probe
        if: ${{ github.event.inputs.stage == 'ga' && github.event.inputs.brain_url != '' }}
        env:
          BRAIN_URL: ${{ github.event.inputs.brain_url }}
          GHOST_API_KEY: ${{ secrets.GHOST_API_KEY }}
        run: |
          python scripts/verify_slo.py --base-url "$BRAIN_URL" --max-p95-ms 700 --api-key "$GHOST_API_KEY"

