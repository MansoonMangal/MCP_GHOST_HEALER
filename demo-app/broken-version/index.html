<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealQA Platform — Login (v2.0 - Broken Locators)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">🛡️</div>
        <h1>HealQA</h1>
      </div>
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to your QA automation platform</p>

      <form id="auth-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="user-email">Email Address</label>
          <!--
            ❌ BREAKING CHANGE: id changed from "email" → "user-email"
            Tests using #email will FAIL → MCP server will heal to #user-email
          -->
          <input id="user-email" name="user-email" type="email"
                 placeholder="Enter your email" required />
        </div>
        <div class="form-group">
          <label for="user-password">Password</label>
          <!--
            ❌ BREAKING CHANGE: id changed from "password" → "user-password"
          -->
          <input id="user-password" name="user-password" type="password"
                 placeholder="Enter your password" required />
        </div>
        <!--
          ❌ BREAKING CHANGE: id changed from "login-btn" → "btn-submit"
          Tests using #login-btn will FAIL → MCP server will heal to #btn-submit
        -->
        <button id="btn-submit" type="submit" class="btn-primary">Login</button>
      </form>

      <p class="version-badge">
        ⚠️ Broken Version v2.0 — Changed locators: #user-email · #user-password · #btn-submit
      </p>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('user-email').value;
      const password = document.getElementById('user-password').value;
      if (email && password) {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
